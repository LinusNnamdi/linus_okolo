<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video CV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1115;
      --surface: #181b22;
      --surface-hover: #1f232d;
      --border: #2a2f3a;
      --text: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --divider: #2a2f3a;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .hire-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #25d366;
      color: #fff;
      font-weight: 600;
      font-size: 0.9375rem;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(37, 211, 102, 0.25);
    }

    .hire-btn:hover {
      background: #1ebe57;
      transform: translateY(-1px);
    }

    .hire-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
    }

    .empty-state svg {
      width: 56px;
      height: 56px;
      color: var(--text-muted);
      margin-bottom: 1rem;
      opacity: 0.6;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 0.9375rem;
    }

    /* Video card */
    .video-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .video-wrapper {
      position: relative;
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    .video-body {
      padding: 1.25rem 1.5rem 1.5rem;
    }

    .video-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
    }

    .video-desc {
      color: var(--text-muted);
      font-size: 0.9375rem;
      line-height: 1.65;
    }

    .video-desc.collapsed {
      display: -webkit-box;
      /* -webkit-line-clamp: 3; */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .show-more {
      display: inline-block;
      margin-top: 0.5rem;
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: color 0.15s ease;
    }

    .show-more:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .show-more.hidden {
      display: none;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--divider);
      margin: 2rem 0;
      border: none;
    }

    /* Footer */
    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8125rem;
    }

    /* Responsive */
    @media (max-width: 480px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .hire-btn {
        width: 100%;
        justify-content: center;
      }

      .container {
        padding: 1.5rem 1rem 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Video CV</h1>
        <p>Professional video portfolio</p>
      </div>
      <a class="hire-btn" href="https://wa.me/2348148478414" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Hire Me
      </a>
    </header>

    <main id="videos-container">
      <!-- Videos rendered by JS -->
    </main>

    <footer>
      &copy; <span id="year"></span> Linus Nnamdi Okolo Video CV
    </footer>
  </div>

  <script>
    // ============================================================
    // VIDEO DATA — Add or remove videos here
    // ============================================================
    const videos = [
      // Example entries (remove or replace with your own):
      {
        uri: "videos/IaC1.mp4",
        title: "Team's Terraform Provisioning",
        description: "Here, We are trouble shooting our Terraform provisioning code, which failed because the Admin role provided by the AWS team was wrong."
      },
      // {
      //   uri: "https://example.com/video2.mp4",
      //   title: "Technical Walkthrough",
      //   description: "Deep dive into architecture decisions and implementation details."
      // }
    ];

    // ============================================================
    // RENDER LOGIC
    // ============================================================
    const container = document.getElementById('videos-container');
    document.getElementById('year').textContent = new Date().getFullYear();

    function renderVideos() {
      if (!videos || videos.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <h2>No Video CV yet</h2>
            <p>Videos will appear here once they are added.</p>
          </div>
        `;
        return;
      }

      let html = '';
      videos.forEach((video, index) => {
        const id = `desc-${index}`;
        const btnId = `btn-${index}`;
        html += `
          <article class="video-card">
            <div class="video-wrapper">
              <video controls preload="metadata" playsinline>
                <source src="${escapeAttr(video.uri)}" type="video/mp4">
                Your browser does not support the video tag.
              </video>
            </div>
            <div class="video-body">
              <h2 class="video-title">${escapeHtml(video.title || 'Untitled')}</h2>
              <p class="video-desc collapsed" id="${id}">${escapeHtml(video.description || '')}</p>
              <button class="show-more hidden" id="${btnId}" type="button" data-target="${id}">Show more</button>
            </div>
          </article>
        `;
        if (index < videos.length - 1) {
          html += '<hr class="divider">';
        }
      });
      container.innerHTML = html;

      // Attach expand/collapse logic after rendering
      videos.forEach((_, index) => {
        const desc = document.getElementById(`desc-${index}`);
        const btn = document.getElementById(`btn-${index}`);
        if (!desc || !btn) return;

        // Check if text is truncated
        requestAnimationFrame(() => {
          const isTruncated = desc.scrollHeight > desc.clientHeight + 2;
          if (isTruncated) {
            btn.classList.remove('hidden');
            btn.addEventListener('click', () => {
              const isCollapsed = desc.classList.contains('collapsed');
              if (isCollapsed) {
                desc.classList.remove('collapsed');
                btn.textContent = 'Show less';
              } else {
                desc.classList.add('collapsed');
                btn.textContent = 'Show more';
              }
            });
          }
        });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    renderVideos();
  </script>
</body>
</html>
